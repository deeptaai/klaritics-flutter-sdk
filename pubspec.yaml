name: klaritics_flutter
description: Flutter SDK wrapper for Klaritics SDKs. See klaritics.com for native documentation.
version: 1.0.0

environment:
  sdk: ">=2.16.2 <3.0.0"
  flutter: ">=2.5.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  js: ^0.6.5

  logger: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0

flutter:
  plugin:
    platforms:
      web:
        pluginClass: FlutterKlariticsWeb
        fileName: klaritics_flutter.dart

      android:
        package: com.deeptaai.klaritics.flutter
        pluginClass: KlariticsFlutterPlugin
      ios:
        pluginClass: KlariticsFlutterPlugin
